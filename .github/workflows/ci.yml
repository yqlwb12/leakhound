name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e .
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Demo run finds exactly the three real secrets
        run: |
          python examples/make_demo.py
          set +e
          leakhound demo/leaky.py --format json > findings.json
          test $? -eq 1
          python -c "import json; d=json.load(open('findings.json')); assert len(d['findings']) == 3, d"
      - name: Clean tree exits zero
        run: |
          set +e
          leakhound tests --ignore '*.py' > /dev/null
          test $? -eq 0
